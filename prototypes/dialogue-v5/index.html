<!doctype html><html lang="zh-CN" data-ui-theme="xiacheng" data-ui-preset="daylight" data-theme="day"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content"><meta name="color-scheme" content="light dark"><title>夏澄 · 对话演出原型 v5</title>
<script>(function(){var q=new URLSearchParams(location.search),t=q.get('theme'),s;try{s=localStorage.getItem('nowadays-dialogue-v5-theme')}catch(e){}if(t!=='night'&&t!=='day')t=s==='night'?'night':'day';document.documentElement.dataset.theme=t;document.documentElement.dataset.uiPreset=t==='night'?'nightwave':'daylight';document.documentElement.dataset.light=t;if(q.get('motion')==='reduced')document.documentElement.dataset.motion='reduced';})();</script>
<link rel="icon" href="assets/brand/fold-light.svg"><link rel="stylesheet" href="reference/character-tokens.css"><link rel="stylesheet" href="reference/controls.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="performance.css"></head>
<body><svg class="svg-defs" aria-hidden="true"><defs>
<symbol id="back" viewBox="0 0 24 24"><path d="M20 12H4m7-7-7 7 7 7"/></symbol><symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol><symbol id="search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol><symbol id="history" viewBox="0 0 24 24"><path d="M4 9a8.5 8.5 0 1 1-.2 6M4 4v5h5M12 7v5l3 2"/></symbol><symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol><symbol id="moon" viewBox="0 0 24 24"><path d="M20.5 14.4A8.7 8.7 0 0 1 9.6 3.5 8.8 8.8 0 1 0 20.5 14.4Z"/></symbol><symbol id="send" viewBox="0 0 24 24"><path d="m4 11 16-7-7 16-2-7-7-2Zm7 2 9-9"/></symbol><symbol id="speaker" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Zm12-1a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol><symbol id="tune" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16M8 5v4m8 1v4m-6 1v4"/></symbol><symbol id="down" viewBox="0 0 24 24"><path d="M12 4v16m-6-6 6 6 6-6"/></symbol><symbol id="image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8" cy="9" r="1.5"/><path d="m4 18 5-5 4 4 3-3 5 5"/></symbol><symbol id="person" viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="3.5"/><path d="M5 21v-3a7 7 0 0 1 14 0v3"/></symbol><symbol id="reset" viewBox="0 0 24 24"><path d="M4 9a8.5 8.5 0 1 1 .5 7M4 4v5h5"/></symbol><symbol id="upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 16v5h16v-5"/></symbol><symbol id="calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6m10-6v6M3 11h18M8 15h2m4 0h2m-8 3h2"/></symbol><symbol id="locate" viewBox="0 0 24 24"><path d="M4 6h16M4 18h16M12 3v18m-4-4 4 4 4-4"/></symbol><symbol id="chev-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol><symbol id="chev-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol><symbol id="chev-up" viewBox="0 0 24 24"><path d="m5 15 7-7 7 7"/></symbol><symbol id="chev-down" viewBox="0 0 24 24"><path d="m5 9 7 7 7-7"/></symbol><symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
</defs></svg>
<header class="topbar"><div class="topbar-identity"><button class="icon-button back-button" id="back-button" aria-label="返回"><svg><use href="#back"/></svg></button><span class="identity-rule" aria-hidden="true"></span><h1>夏澄</h1></div><div class="theme-switch" role="group" aria-label="场景光色" data-state="day"><span class="theme-thumb" aria-hidden="true"></span><button data-theme-choice="day" id="theme-day" aria-label="白昼来信" aria-pressed="true"><span class="theme-icon" aria-hidden="true"><svg><use href="#sun"/></svg></span><span class="theme-label">白昼来信</span></button><button data-theme-choice="night" id="theme-night" aria-label="晚风电台" aria-pressed="false"><span class="theme-icon" aria-hidden="true"><svg><use href="#moon"/></svg></span><span class="theme-label">晚风电台</span></button></div><div class="topbar-actions"><button class="icon-button" id="performance-settings" aria-label="演出设置" title="演出设置" aria-haspopup="dialog"><svg aria-hidden="true"><use href="#tune"/></svg></button><button class="history-launch btn btn-sm" id="history-button" aria-haspopup="dialog" aria-expanded="false" aria-controls="history-panel"><svg aria-hidden="true"><use href="#history"/></svg><span>历史<span class="history-word">消息</span></span></button></div></header>
<main class="dialogue-layout">
<section class="stage" id="stage" data-light="day" aria-label="背景与角色独立的演出画布"><div class="background-layer" id="background-layer"><img id="background-a" class="layer-image active" src="assets/xiacheng/scene-day.webp" alt=""><img id="background-b" class="layer-image" alt=""></div><div class="character-layer" id="character-layer"><img id="character-a" class="layer-image active" src="assets/xiacheng/character-day.webp" alt="夏澄，完整透明立绘"><img id="character-b" class="layer-image" alt="" aria-hidden="true"></div><img id="performance-sprite" class="performance-sprite" alt="" hidden><div id="scene-cover" class="scene-cover" aria-hidden="true" hidden><img id="scene-background" alt=""><img id="scene-figure" alt="" hidden></div><button id="scene-dismiss" class="btn btn-sm scene-dismiss" type="button" hidden>收起过场图</button><div class="scene-light" aria-hidden="true"><i class="sun-beam"></i></div><div class="stage-cue" aria-hidden="true"></div><div class="layer-tools"><button class="icon-button" id="background-button" aria-label="更换背景" title="更换背景" aria-haspopup="dialog"><svg><use href="#image"/></svg></button><button class="icon-button" id="character-button" aria-label="更换角色立绘" title="更换角色立绘" aria-haspopup="dialog"><svg><use href="#person"/></svg></button></div></section>
<section class="conversation-pane" aria-label="与夏澄的对话"><div class="chat-pane" id="chat-pane"><div class="timeline-wrap"><div class="messages" id="messages" role="log" aria-live="off" aria-label="对话记录，可上下滚动" tabindex="0"></div><button id="latest-button" class="latest-button" hidden><svg aria-hidden="true"><use href="#down"/></svg><span>回到最新</span><i aria-hidden="true"></i></button><div class="date-notice" id="date-notice" hidden></div></div>
<form class="composer" id="composer"><div class="writing-frame"><label class="sr-only" for="draft">输入消息</label><textarea id="draft" rows="2" maxlength="2000" placeholder="想说什么，就慢慢说。" spellcheck="false"></textarea><div class="composer-controls"><span class="demo-label" id="demo-label">交互示例 · 本地模拟</span><div class="send-controls"><button class="btn btn-primary btn-sm" id="send-button" type="submit" disabled aria-disabled="true" title="Enter 发送；Shift + Enter 换行"><span>发送</span><svg aria-hidden="true"><use href="#send"/></svg></button></div></div></div><p id="reply-error" class="reply-error" role="status" hidden></p></form><div id="turn-controls" class="turn-controls" hidden><span id="turn-status" role="status"></span><button class="btn btn-primary btn-sm" type="button" id="next-segment" aria-disabled="true">下一句<svg aria-hidden="true"><use href="#chev-right"/></svg></button></div></div>
<section class="history-panel" id="history-panel" role="dialog" aria-modal="false" aria-labelledby="history-title" hidden><header class="history-heading"><h2 id="history-title"><svg aria-hidden="true"><use href="#history"/></svg>历史消息</h2><button class="icon-button" id="history-close" aria-label="关闭历史消息"><svg><use href="#close"/></svg></button></header>
<div class="history-search-row"><div class="search-field"><svg aria-hidden="true"><use href="#search"/></svg><label class="sr-only" for="history-search">关键词检索</label><input id="history-search" type="search" placeholder="找一句话，或一个瞬间" autocomplete="off" spellcheck="false" aria-describedby="hit-count"><button class="icon-button" id="search-clear" aria-label="清除关键词" hidden><svg><use href="#close"/></svg></button></div><div class="hit-nav" id="hit-nav" hidden><button class="icon-button" id="hit-prev" aria-label="上一处"><svg><use href="#chev-up"/></svg></button><span id="hit-count" aria-live="polite"></span><button class="icon-button" id="hit-next" aria-label="下一处"><svg><use href="#chev-down"/></svg></button></div></div>
<div class="timeline-shell"><div class="timeline-scroll" id="timeline-scroll"><div class="timeline-track" id="timeline-track" role="toolbar" aria-orientation="horizontal" aria-label="对话日期时间轴：左右方向键切换日期，Enter 进入片段"></div></div></div>
<div class="day-heading"><div class="day-title-wrap"><strong id="day-title"></strong><span id="day-meta"></span></div><div class="day-tools"><div class="timeline-legend" aria-hidden="true"><i class="tier-1"></i><i class="tier-2"></i><i class="tier-3"></i><span>消息多少</span></div><button class="text-button" id="clear-filters">清空条件</button></div></div>
<div class="snippet-area" id="snippet-area"><div class="card-stack" id="card-stack" role="group" aria-roledescription="叠放片段" aria-label="当天片段：左右方向键切换，Enter 回到这句话"></div><div class="card-controls"><button class="icon-button" id="card-prev" aria-label="上一张片段"><svg><use href="#chev-left"/></svg></button><span id="card-count"></span><button class="icon-button" id="card-next" aria-label="下一张片段"><svg><use href="#chev-right"/></svg></button><span class="card-hint">点片段，回到这句话</span></div></div>
<div class="history-empty" id="history-empty" hidden><svg aria-hidden="true"><use href="#search"/></svg><h3>这段时间里，还没找到。</h3><p>换一个词试试，或清空条件看看全部日期。</p><button class="btn btn-sm" id="empty-reset">清空条件</button></div></section>
</section></main>
<dialog class="asset-dialog" id="asset-dialog" aria-labelledby="asset-title"><header><h2 id="asset-title">替换背景</h2><button class="icon-button" id="asset-close" aria-label="取消替换"><svg><use href="#close"/></svg></button></header><div class="asset-preview" id="asset-preview"><img id="asset-preview-image" alt="待应用的图层预览"></div><div class="asset-selection-name" id="asset-selection-name"></div><div class="preset-options" id="preset-options"></div><button class="btn import-button" id="import-button"><svg aria-hidden="true"><use href="#upload"/></svg>从本地选择图片</button><input type="file" id="asset-file" accept="image/png,image/jpeg,image/webp,image/avif" hidden><div class="asset-error" id="asset-error" role="status"></div><footer><button class="text-button" id="asset-reset"><svg aria-hidden="true"><use href="#reset"/></svg>重置此图层</button><div><button class="btn btn-sm" id="asset-cancel">取消</button><button class="btn btn-primary btn-sm" id="asset-apply">应用</button></div></footer></dialog>
<dialog class="performance-dialog" id="performance-dialog" aria-labelledby="performance-title">
  <form method="dialog"><header><h2 id="performance-title">演出设置</h2><button class="icon-button" aria-label="关闭演出设置"><svg aria-hidden="true"><use href="#close"/></svg></button></header></form>
  <label><input type="checkbox" id="voice-auto">自动播放新台词</label>
  <label><input type="checkbox" id="scene-auto">自动演示过场图</label>
  <p>点台词旁的小喇叭可重听。演示语音使用设备上的中文朗读，过场图使用示例图片。</p>
</dialog>
<dialog class="performance-dialog" id="scene-dialog" aria-labelledby="scene-title">
  <form method="dialog"><header><h2 id="scene-title">为这一轮生成过场图</h2><button class="icon-button" aria-label="取消生成过场图"><svg aria-hidden="true"><use href="#close"/></svg></button></header></form>
  <p>选择要在左侧舞台替换的画面。</p>
  <div class="scene-options"><button class="btn btn-sm" type="button" data-scene-mode="background">只换背景</button><button class="btn btn-sm" type="button" data-scene-mode="full_scene">人物与背景</button></div>
</dialog>
<div class="toast" id="toast" role="status" hidden></div><div class="sr-only" id="announcer" aria-live="polite" aria-atomic="true"></div>
<script src="engine.js"></script><script src="performance.js"></script><script src="app.js"></script></body></html>

# 部署 GitHub Pages：仅发布 pages/ 目录（架构图等静态资源），不暴露仓库其余内容
# 首次使用需在仓库 Settings → Pages 将 Source 设为 GitHub Actions。
name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Pages 部署所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署，新推送取消进行中的构建
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # artifact 根即站点根：只上传 pages/ 目录内容
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v4

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows-release:
    name: 发布 Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 防止 tag 版本与 package.json 不一致导致发布出错误版本的安装包
      - name: 校验 tag 与 package.json 版本一致
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package.json 版本 ${version} 不一致，请修正后再打 tag"
            exit 1
          fi

      - name: 安装依赖
        run: npm ci

      - name: 桌面端构建 (main + renderer)
        run: npm run desktop:build

      - name: 打包 NSIS 安装包与便携版
        run: node desktop/scripts/package.mjs

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.blockmap
          generate_release_notes: true

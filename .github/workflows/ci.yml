name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  core:
    name: 构建、类型检查与测试 (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建 (tsc)
        run: npm run build

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

  desktop:
    name: 桌面端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 桌面端构建 (main + renderer)
        run: npm run desktop:build

  windows-package:
    name: Windows 打包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 桌面端构建 (main + renderer)
        run: npm run desktop:build

      - name: 打包 NSIS 安装包与便携版
        run: node desktop/scripts/package.mjs

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: nowadays-windows-${{ github.sha }}
          path: release/*.exe
          if-no-files-found: error
